[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowhide"
version = "0.1.0"
description = "A PNG LSB steganography and image inspection toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "ShadowHide contributors"}]
dependencies = [
    "Pillow>=10.0,<13",
    "cryptography>=42.0,<45",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.11,<1",
]

[project.scripts]
shadowhide = "shadowhide.cli:main"
shadowhide-gui = "shadowhide.gui:main"

[tool.setuptools.packages.find]
include = ["shadowhide*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
